# Siamese TransUNet with concatenation fusion, class-weighted CE
experiment: transunet_ce

data:
  xbd_root: /kaggle/input/datasets/qianlanzz/xbd-dataset/xbd
  mask_root: /kaggle/input/notebooks/azra41221/03-preprocessing-split/masks
  train_split: splits/train.csv
  val_split: splits/val.csv
  crop_size: 512

model:
  name: siamese_transunet
  encoder: vit_base_r50_s16_384
  fusion: concat

loss:
  gamma: 0.0
  lam: 1.0
  class_weights: [0.0797, 0.4791, 1.3820, 1.3340, 1.7251]

training:
  batch_size: 8
  val_batch_size: 2
  num_workers: 4
  learning_rate: 0.0001
  max_epochs: 40
  out_dir: /kaggle/working/outputs/transunet_ce