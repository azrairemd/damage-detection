[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "damage-detection"
version = "0.0.1"
description = "Building damage assessment from pre/post-disaster satellite imagery (xBD) with a Siamese U-Net and Grad-CAM."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Azra İrem Dalhasanoğlu" }]
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]